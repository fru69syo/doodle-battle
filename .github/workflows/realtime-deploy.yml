# Manual deploy of the realtime battle server to Cloud Run (docs/LEARN_GCP.md §5.5).
#
#   test -> build image -> push to Artifact Registry -> new Cloud Run revision -> /healthz check
#   -> automatic rollback to the previous revision if the check fails
#
# Authentication: Workload Identity Federation (no JSON key). The job runs in the GitHub
# environment `realtime-<env>`, which holds these *variables* (not secrets; none are sensitive):
#   GCP_PROJECT_ID, GCP_WIF_PROVIDER (bootstrap output), GCP_DEPLOY_SA (envs output
#   realtime_deployer_sa). Add "Required reviewers" to realtime-prod so a human approves.
name: Deploy realtime server (manual)

on:
  workflow_dispatch:
    inputs:
      env:
        description: "Environment"
        required: true
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  contents: read

concurrency:
  group: realtime-deploy-${{ inputs.env }}
  cancel-in-progress: false

env:
  REGION: asia-northeast1
  SERVICE: battle
  REPOSITORY: containers

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server/realtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/realtime/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  deploy:
    name: Build and deploy to ${{ inputs.env }}
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: realtime-${{ inputs.env }}
    permissions:
      contents: read
      id-token: write # lets the job request a GitHub OIDC token for WIF
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
    steps:
      - name: Check environment variables
        env:
          WIF: ${{ vars.GCP_WIF_PROVIDER }}
          SA: ${{ vars.GCP_DEPLOY_SA }}
        run: |
          for v in PROJECT_ID WIF SA; do
            if [[ -z "${!v}" ]]; then echo "::error::Set $v (GitHub environment realtime-${{ inputs.env }})"; exit 1; fi
          done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
          token_format: access_token

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - id: build
        name: Build and push (tag = commit sha; tags are immutable)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: server/realtime/Dockerfile
          push: true
          provenance: false
          tags: ${{ env.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/battle:${{ github.sha }}

      - id: deploy
        name: Roll out a new revision (image only; everything else is Terraform's)
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/battle@${{ steps.build.outputs.digest }}
        run: |
          prev="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.latestReadyRevisionName)')"
          echo "previous=$prev" >> "$GITHUB_OUTPUT"
          gcloud run services update "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --image "$IMAGE" --quiet
          url="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Health check, roll back on failure
        env:
          URL: ${{ steps.deploy.outputs.url }}
          PREVIOUS: ${{ steps.deploy.outputs.previous }}
        run: |
          for _ in $(seq 1 10); do
            if curl -fsS --max-time 10 "$URL/healthz" | grep -q '"ok":true'; then
              echo "### Deployed ${GITHUB_SHA::7} to ${{ inputs.env }}: $URL" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 6
          done
          echo "::error::/healthz failed; rolling back to $PREVIOUS"
          if [[ -n "$PREVIOUS" ]]; then
            gcloud run services update-traffic "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --to-revisions "$PREVIOUS=100" --quiet
          fi
          exit 1
