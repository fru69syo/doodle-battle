# Manual deploy of Cloud Functions and/or Firestore + Storage rules (+ indexes, TTL). Never runs
# on push. See docs/RELEASE.md §1.7 and docs/BACKEND.md §14.
#
# Authentication: Workload Identity Federation (no JSON key). The GitHub environment
# `firebase-<env>` holds the variables GCP_PROJECT_ID, GCP_WIF_PROVIDER, GCP_FIREBASE_DEPLOY_SA
# (Terraform output firebase_deployer_sa) and CLAUDE_MODEL. Add required reviewers to firebase-prod.
name: Deploy Firebase (manual)

on:
  workflow_dispatch:
    inputs:
      env:
        description: "Environment (selects the GitHub environment firebase-<env>)"
        required: true
        type: choice
        options: [dev, prod]
        default: dev
      project_id:
        description: "Firebase project id to deploy to"
        required: true
        type: string
      targets:
        description: "What to deploy"
        required: true
        type: choice
        options:
          - functions,firestore,storage
          - firestore,storage
          - functions
        default: functions,firestore,storage
      confirm:
        description: "Type the project id again to confirm"
        required: true
        type: string
      force:
        description: "Pass --force (deletes functions that are no longer in the source)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: firebase-deploy-${{ inputs.project_id }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.targets }} to ${{ inputs.project_id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: firebase-${{ inputs.env }}
    permissions:
      contents: read
      id-token: write # GitHub OIDC token for Workload Identity Federation
    env:
      PROJECT_ID: ${{ inputs.project_id }}
      ENV_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      CONFIRM: ${{ inputs.confirm }}
      TARGETS: ${{ inputs.targets }}
      FORCE: ${{ inputs.force }}
    defaults:
      run:
        working-directory: firebase/functions
    steps:
      - name: Confirm target project
        working-directory: .
        run: |
          if [[ "$PROJECT_ID" != "$CONFIRM" ]]; then
            echo "::error::confirmation does not match project id"; exit 1
          fi
          if [[ ! "$PROJECT_ID" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]$ ]] || [[ "$PROJECT_ID" == demo-* ]]; then
            echo "::error::'$PROJECT_ID' is not a deployable project id"; exit 1
          fi
          if [[ "$PROJECT_ID" != "$ENV_PROJECT_ID" ]]; then
            echo "::error::project id does not match GCP_PROJECT_ID of environment firebase-${{ inputs.env }}"; exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: firebase/functions/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit

      - name: Functions params (.env.<project>)
        if: contains(inputs.targets, 'functions')
        env:
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
        run: |
          if [[ -z "$CLAUDE_MODEL" ]]; then
            echo "::error::Set the environment variable CLAUDE_MODEL (latest Haiku-class model id) in environment firebase-${{ inputs.env }}"
            exit 1
          fi
          printf 'CLAUDE_MODEL=%s\n' "$CLAUDE_MODEL" > ".env.${PROJECT_ID}"

      # Short-lived credentials via WIF; writes a credentials file and sets
      # GOOGLE_APPLICATION_CREDENTIALS, which the firebase CLI picks up.
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_FIREBASE_DEPLOY_SA }}
          create_credentials_file: true

      - name: Deploy
        run: |
          extra=()
          [[ "$FORCE" == "true" ]] && extra+=(--force)
          npx firebase deploy --config ../firebase.json --project "$PROJECT_ID" \
            --only "$TARGETS" --non-interactive "${extra[@]}"
