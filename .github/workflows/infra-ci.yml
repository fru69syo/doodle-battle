# Terraform checks on every PR that touches infra/. Offline only: no cloud credentials, no state
# (`init -backend=false`). Plans against the real project run in infra-apply.yml.
name: Infra CI

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/infra-ci.yml"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/infra-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infra-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TERRAFORM_VERSION: "1.16.5"
  TFLINT_VERSION: "v0.64.0"

jobs:
  terraform:
    name: fmt / validate / tflint (${{ matrix.root }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        root: [bootstrap, envs/dev, envs/prod]
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: terraform fmt
        run: terraform fmt -check -recursive -diff
      - name: terraform validate
        working-directory: infra/terraform/${{ matrix.root }}
        run: |
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.tflint.d/plugins
          key: tflint-${{ runner.os }}-${{ hashFiles('infra/terraform/.tflint.hcl') }}
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}
      - name: tflint
        working-directory: infra/terraform/${{ matrix.root }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init --config="$GITHUB_WORKSPACE/infra/terraform/.tflint.hcl"
          tflint --config="$GITHUB_WORKSPACE/infra/terraform/.tflint.hcl" --format=compact
