# Manual Terraform plan -> (human approval) -> apply (docs/LEARN_GCP.md §4.6).
#
# Two GitHub environments per GCP environment, two service accounts:
#   infra-<env>-plan  -> tf-plan@  (read-only; anyone with Actions access can see a plan)
#   infra-<env>       -> tf-apply@ (can change things; add "Required reviewers")
# The apply job applies exactly the plan file the reviewer saw; if anything changed in between,
# Terraform refuses ("saved plan is stale") and you re-run.
#
# Variables in BOTH environments: GCP_PROJECT_ID, GCP_PROJECT_NUMBER, GCP_WIF_PROVIDER,
# GCP_WIF_POOL, TF_STATE_BUCKET, BILLING_ACCOUNT_ID, ALERT_EMAIL
# plus GCP_TF_PLAN_SA (plan environment) / GCP_TF_APPLY_SA (apply environment).
name: Terraform apply (manual)

on:
  workflow_dispatch:
    inputs:
      env:
        description: "Environment"
        required: true
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  contents: read

concurrency:
  group: infra-apply-${{ inputs.env }}
  cancel-in-progress: false

env:
  TERRAFORM_VERSION: "1.16.5"
  WORKDIR: infra/terraform/envs/${{ inputs.env }}

jobs:
  plan:
    name: Plan (${{ inputs.env }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: infra-${{ inputs.env }}-plan
    permissions:
      contents: read
      id-token: write
    outputs:
      changes: ${{ steps.plan.outputs.changes }}
    env:
      TF_IN_AUTOMATION: "1"
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_project_number: ${{ vars.GCP_PROJECT_NUMBER }}
      TF_VAR_billing_account_id: ${{ vars.BILLING_ACCOUNT_ID }}
      TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
      TF_VAR_wif_pool_name: ${{ vars.GCP_WIF_POOL }}
    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TF_PLAN_SA }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: terraform init
        env:
          BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: terraform init -input=false -lockfile=readonly -backend-config="bucket=$BUCKET"
      - id: plan
        name: terraform plan
        run: |
          set +e
          terraform plan -input=false -detailed-exitcode -out=tfplan
          code=$?
          set -e
          if [[ $code -eq 1 ]]; then exit 1; fi
          echo "changes=$([[ $code -eq 2 ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          {
            echo "### terraform plan (${{ inputs.env }})"
            echo '```'
            terraform show -no-color tfplan | tail -c 60000
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.plan.outputs.changes == 'true'
        with:
          name: tfplan-${{ inputs.env }}
          path: ${{ env.WORKDIR }}/tfplan
          retention-days: 1

  apply:
    name: Apply (${{ inputs.env }})
    needs: plan
    if: needs.plan.outputs.changes == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: infra-${{ inputs.env }}
    permissions:
      contents: read
      id-token: write
    env:
      TF_IN_AUTOMATION: "1"
    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tfplan-${{ inputs.env }}
          path: ${{ env.WORKDIR }}
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TF_APPLY_SA }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: terraform init
        env:
          BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: terraform init -input=false -lockfile=readonly -backend-config="bucket=$BUCKET"
      - name: terraform apply (the reviewed plan)
        run: terraform apply -input=false tfplan
