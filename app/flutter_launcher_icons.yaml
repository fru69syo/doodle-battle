# Launcher icons (Release team). PLACEHOLDER artwork generated by
# store/tools/gen_graphics.py — replace the PNGs in assets/launcher/ and run:
#   dart run flutter_launcher_icons
# Sources are not bundled into the app (assets/launcher/ is not listed in pubspec assets).
flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/launcher/icon-legacy.png"
  min_sdk_android: 24
  adaptive_icon_background: "#FFF8E7"
  adaptive_icon_foreground: "assets/launcher/icon-foreground.png"
  # The artwork already keeps the 66dp safe zone of the 108dp canvas, so no extra inset.
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: "assets/launcher/icon-monochrome.png"
